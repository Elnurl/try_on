<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eynek VTO — Admin</title>
    <link rel="icon" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/app.css?v=1" />
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="brand">EYNƏK VTO <small>Admin</small></div>
        <a href="/studio" class="muted">Studio →</a>
      </div>

      <section class="card" id="loginCard">
        <h2>Admin girişi</h2>
        <form id="loginForm" class="row">
          <label class="field">Parol<input type="password" id="password" autocomplete="current-password" /></label>
          <div style="align-self: end"><button class="btn" type="submit">Daxil ol</button></div>
        </form>
        <p class="error" id="loginError"></p>
      </section>

      <div id="app" hidden>
        <section class="card">
          <h2>Yeni mağaza / sayt</h2>
          <p class="muted">Hər sayt (məsələn eynek.store) bir mağazadır. API açarı yalnız bir dəfə göstərilir, onu saxlayın.</p>
          <form id="createForm" class="row">
            <label class="field">ID<input type="text" id="storeId" placeholder="eynek-store" required /></label>
            <label class="field">Ad<input type="text" id="storeName" placeholder="eynek.store" /></label>
            <div style="align-self: end"><button class="btn" type="submit">Yarat</button></div>
          </form>
          <p class="error" id="createError"></p>
          <pre class="code" id="secret" hidden></pre>
        </section>

        <section class="card">
          <h2>Mağazalar</h2>
          <table>
            <thead><tr><th>ID</th><th>Ad</th><th>Məhsul</th><th></th></tr></thead>
            <tbody id="stores"></tbody>
          </table>
        </section>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      let password = sessionStorage.getItem("eynek-admin") || "";

      async function api(path, opts = {}) {
        const res = await fetch(path, {
          ...opts,
          headers: { "Content-Type": "application/json", "X-Admin-Password": password, ...(opts.headers || {}) },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Xəta");
        return data;
      }

      function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      function showSecret(lines) {
        $("secret").hidden = false;
        $("secret").textContent = lines.join("\n");
      }

      async function load() {
        const data = await api("/v1/admin/stores");
        $("loginCard").hidden = true;
        $("app").hidden = false;
        $("stores").innerHTML = data.stores
          .map(
            (s) => `<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${s.products}</td>
              <td style="text-align:right;white-space:nowrap">
                <button class="btn small ghost" data-key="${esc(s.id)}">Yeni API açarı</button>
                <button class="btn small" data-link="${esc(s.id)}">Satıcı linki</button>
              </td></tr>`,
          )
          .join("");
        document.querySelectorAll("[data-key]").forEach((b) => {
          b.onclick = async () => {
            if (!confirm("Köhnə açar işləməyəcək. Davam?")) return;
            const r = await api(`/v1/admin/stores/${b.dataset.key}/key`, { method: "POST" });
            showSecret([`Mağaza: ${r.id}`, `API açarı: ${r.apiKey}`]);
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
        });
        document.querySelectorAll("[data-link]").forEach((b) => {
          b.onclick = async () => {
            const seller = prompt("Satıcının adı / ID (boş qala bilər):", "") ?? null;
            if (seller === null) return;
            const r = await api(`/v1/admin/stores/${b.dataset.link}/upload-link`, {
              method: "POST",
              body: JSON.stringify({ seller, ttl: 7 * 24 * 3600 }),
            });
            showSecret([`Satıcı yükləmə linki (7 gün):`, r.studioUrl]);
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
        });
      }

      $("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        password = $("password").value;
        try {
          await load();
          sessionStorage.setItem("eynek-admin", password);
        } catch (err) {
          $("loginError").textContent = err.message;
        }
      });

      $("createForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        $("createError").textContent = "";
        try {
          const r = await api("/v1/admin/stores", {
            method: "POST",
            body: JSON.stringify({ id: $("storeId").value.trim(), name: $("storeName").value.trim() }),
          });
          showSecret([
            `Mağaza: ${r.id}`,
            `API açarı: ${r.apiKey}`,
            "",
            "Saytda:",
            `<script src="${location.origin}/sdk/eynek-vto.js" data-store="${r.id}" async><\/script>`,
          ]);
          $("createForm").reset();
          load();
        } catch (err) {
          $("createError").textContent = err.message;
        }
      });

      load().catch(() => {});
    </script>
  </body>
</html>
