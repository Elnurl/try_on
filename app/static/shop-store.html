<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{STORE_NAME}} | Eynək.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/shop.css?v=50" />
  </head>
  <body class="g-body">
    <div class="g-ribbon"><p>Marketplace satıcı vitrini</p></div>
    <header class="g-header">
      <div class="g-wrap g-header-top">
        <a class="g-logo" href="/shop">EYNƏK</a>
        <nav class="g-nav" aria-label="Əsas" style="display:flex;padding:0">
          <a class="g-nav-link" href="/shop">Kataloq</a>
          <a class="g-nav-link" href="/shop#stores">Satıcılar</a>
          <a class="g-nav-link" href="/cart">Səbət</a>
        </nav>
        <div class="g-header-tools">
          <a class="g-icon-btn solid" href="/cart" aria-label="Səbət">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
              <path d="M3 6h18" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
            <span class="g-count" data-cart-count>0</span>
          </a>
        </div>
      </div>
    </header>
    <main class="g-wrap">
      <nav class="g-crumb">
        <a href="/shop">Marketplace</a>
        <span>/</span>
        <a href="/shop#stores">Satıcılar</a>
        <span>/</span>
        <span>{{STORE_NAME}}</span>
      </nav>
      <section class="g-store-hero">
        <p class="g-brand">{{STORE_CITY}}</p>
        <h1>{{STORE_NAME}}</h1>
        <p class="g-store-tagline">{{STORE_TAGLINE}}</p>
        <p class="g-section-meta">Bu mağazadan {{STORE_COUNT}} eynək</p>
      </section>
      <section class="g-section" style="padding-top:0">
        <div class="g-grid" data-product-grid>{{PRODUCT_CARDS}}</div>
      </section>
    </main>
    <footer class="g-footer">
      <div class="g-wrap">
        <strong>Eynək.com</strong>
        <p><a href="/shop">Marketplace-ə qayıt</a></p>
      </div>
    </footer>
    <div class="g-toast" data-toast hidden></div>
    <script>
      window.SHOP_PRODUCTS = {{PRODUCTS_JSON}};
    </script>
    <script src="/static/shop.js?v=50"></script>
  </body>
</html>
