<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Virtual sınaq</title>
    <link rel="icon" href="/static/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/embed.css?v=3" />
    <script type="importmap">
      { "imports": { "three": "/static/vendor/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <main class="vto" id="app">
      <section class="stage" id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
      </section>

      <div class="hud">
        <div class="hud-top">
          <div class="hint" id="hint" hidden></div>
          <button type="button" class="glass-btn" id="closeBtn" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
          </button>
        </div>

        <div class="rail">
          <button type="button" class="glass-btn" id="shotBtn">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.2-2h6.6l1.2 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5zM12 16.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" /></svg>
            <span class="rail-label"></span>
          </button>
          <label class="glass-btn" id="selfieBtn">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 16.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5M12 15V4M7.5 8.5L12 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <span class="rail-label"></span>
            <input type="file" id="photoInput" accept="image/*" hidden />
          </label>
          <button type="button" class="glass-btn" id="camBtn" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3.5 8A1.5 1.5 0 0 1 5 6.5h9A1.5 1.5 0 0 1 15.5 8v8a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 16zM15.5 10.5l5-3v9l-5-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" /></svg>
            <span class="rail-label"></span>
          </button>
        </div>

        <div class="hud-bottom">
          <div class="product-card">
            <div class="product-text">
              <div class="eyebrow" id="vendor"></div>
              <h1 id="productName"></h1>
              <p class="price" id="productPrice"></p>
            </div>
            <button type="button" class="btn" id="cartBtn" hidden></button>
          </div>
          <div class="strip-wrap" id="stripWrap" hidden>
            <div class="strip-label" id="stripLabel"></div>
            <div class="strip" id="strip"></div>
          </div>
        </div>
      </div>

      <div class="busy" id="busy" hidden><span class="spinner"></span><span id="busyText"></span></div>
      <div class="toast" id="toast" role="status" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <span id="toastText"></span>
        <button type="button" class="link-btn" id="viewCartBtn"></button>
      </div>

      <div class="screen" id="screen" hidden></div>
    </main>
    <script type="module" src="/static/embed.js?v=3"></script>
  </body>
</html>
