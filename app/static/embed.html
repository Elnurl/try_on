<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Virtual sınaq</title>
    <link rel="icon" href="/static/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/embed.css?v=2" />
    <script type="importmap">
      { "imports": { "three": "/static/vendor/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <main class="vto" id="app">
      <header class="head">
        <div class="head-info">
          <div class="eyebrow" id="vendor"></div>
          <h1 id="productName"></h1>
          <p class="price" id="productPrice"></p>
        </div>
        <button type="button" class="icon-btn" id="closeBtn" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
        </button>
      </header>

      <section class="stage" id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div class="hint" id="hint" hidden></div>
        <div class="busy" id="busy" hidden><span class="spinner"></span><span id="busyText"></span></div>
        <div class="toast" id="toast" role="status" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <span id="toastText"></span>
          <button type="button" class="link-btn" id="viewCartBtn"></button>
        </div>
      </section>

      <footer class="foot">
        <div class="strip-wrap" id="stripWrap" hidden>
          <div class="eyebrow" id="stripLabel"></div>
          <div class="strip" id="strip"></div>
        </div>
        <div class="actions">
          <label class="btn btn-secondary" id="selfieBtn"><span></span><input type="file" id="photoInput" accept="image/*" hidden /></label>
          <button type="button" class="btn btn-secondary" id="camBtn" hidden></button>
          <button type="button" class="btn btn-secondary" id="shotBtn"></button>
          <button type="button" class="btn btn-primary" id="cartBtn" hidden></button>
        </div>
      </footer>

      <div class="screen" id="screen" hidden></div>
    </main>
    <script type="module" src="/static/embed.js?v=2"></script>
  </body>
</html>
