<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EYNƏK — 2.5D try-on</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&subset=latin-ext&display=swap" rel="stylesheet" />
    <style>
      :root { font-family: "Segoe UI", "Noto Sans", Manrope, system-ui, sans-serif; }
      body { margin: 0; background: #111; color: #fff; }
      header { padding: 16px 18px 8px; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 6px 0 0; color: #c4c4c4; font-size: 14px; }
      .stage {
        position: relative;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        background: #1a1a1a;
        aspect-ratio: 3 / 4;
        border-radius: 16px;
        overflow: hidden;
      }
      #cam, #facebg, #hidden2d { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
      .stage.is-live #gl { transform: none; }
      #idle {
        position: absolute; inset: 0; display: grid; place-items: center;
        text-align: center; padding: 24px; color: #ddd; pointer-events: none;
      }
      #idle[hidden] { display: none; }
      #idle strong { display: block; font-size: 18px; margin-bottom: 8px; }
      .bar { max-width: 520px; margin: 0 auto; padding: 12px 16px 28px; display: grid; gap: 8px; }
      button, label.file {
        display: block; width: 100%; padding: 12px; border: 0; border-radius: 12px;
        background: #fff; color: #111; font: inherit; font-weight: 700; text-align: center;
        cursor: pointer;
      }
      button.ghost, label.ghost { background: #2a2a2a; color: #fff; }
      input[type="file"] { display: none; }
      input[type="number"], input[type="range"] { width: 100%; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      #status { min-height: 1.2em; color: #f4c542; font-size: 13px; }
      #preview { width: 72px; height: 36px; object-fit: contain; background: #000; border-radius: 8px; display: none; }
      #preview.is-on { display: block; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <h1>2.5D eynək try-on</h1>
      <p>Ağ fonda ön foto → kəsim + manifest. Kamerada eynək sənin şəklində qalır, qollar 3D-dir.</p>
    </header>
    <div class="stage">
      <video id="cam" playsinline muted autoplay></video>
      <img id="facebg" alt="" />
      <canvas id="hidden2d"></canvas>
      <canvas id="gl"></canvas>
      <div id="idle">
        <div>
          <strong>Eynək şəklini yüklə</strong>
          Ağ fon, düz ön. Əvvəlcə 2.5D model fırlanır, sonra kameranı aç.
        </div>
      </div>
    </div>
    <div class="bar">
      <div class="row">
        <label class="file">Eynək şəkli<input id="glasses" type="file" accept="image/*" /></label>
        <label class="file ghost">Üz şəkli<input id="face" type="file" accept="image/*" /></label>
      </div>
      <label>Çərçivə eni (mm) <input id="widthmm" type="number" min="90" max="170" value="140" /></label>
      <button id="live" type="button">Kameranı aç</button>
      <img id="preview" alt="kəsim" />
      <p id="status">2.5D asset yığılır…</p>
    </div>
    <script type="module" src="/static/try.js?v=31"></script>
  </body>
</html>
