<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EYNƏK Engine — öz VTO SDK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { font-family: Manrope, system-ui, sans-serif; color: #111; }
      body { margin: 0; background: #f4f4f5; }
      header { max-width: 920px; margin: 0 auto; padding: 20px; }
      h1 { margin: 0 0 6px; font-size: 26px; }
      p { margin: 0; color: #667085; }
      .wrap { max-width: 920px; margin: 0 auto; padding: 0 20px 40px; display: grid; gap: 16px; }
      @media (min-width: 800px) { .wrap { grid-template-columns: 1fr 280px; } }
      #stage { height: min(72vh, 640px); border-radius: 16px; background: #111; overflow: hidden; }
      aside { background: #fff; border: 1px solid #e6e7eb; border-radius: 16px; padding: 16px; }
      button, select { width: 100%; margin: 8px 0; padding: 12px; border-radius: 10px; border: 1px solid #d0d5dd; font: inherit; }
      .go { background: #111; color: #fff; border: 0; font-weight: 700; cursor: pointer; }
      .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
      .swatches button { width: 36px; height: 36px; padding: 0; border-radius: 50%; cursor: pointer; }
    </style>
  </head>
  <body>
    <header>
      <p>Sizin engine · MediaPipe + Three.js</p>
      <h1>EYNƏK Try-On SDK</h1>
    </header>
    <div class="wrap">
      <div id="stage"></div>
      <aside>
        <label>Forma
          <select id="style">
            <option value="rectangle">Rectangle</option>
            <option value="wayfarer">Wayfarer</option>
            <option value="aviator">Aviator</option>
            <option value="round">Round</option>
          </select>
        </label>
        <p>Rəng</p>
        <div class="swatches">
          <button type="button" data-color="#151515" style="background:#151515"></button>
          <button type="button" data-color="#6b4423" style="background:#6b4423"></button>
          <button type="button" data-color="#b8960c" style="background:#b8960c"></button>
          <button type="button" data-color="#c0c0c0" style="background:#c0c0c0"></button>
        </div>
        <button id="start" class="go" type="button">Kameranı aç</button>
        <p id="msg">Bu SDK sizindir. Satıcıya forma + rəng kifayətdir — TINT fotosu yox.</p>
      </aside>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.1/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import { EynekTryOn } from "/static/sdk/eynek-tryon.js";
      const msg = document.querySelector("#msg");
      let vto = null;
      let style = "rectangle";
      let color = 0x151515;
      document.querySelector("#style").addEventListener("change", (e) => {
        style = e.target.value;
        if (vto) vto.setFrame({ style, color });
      });
      document.querySelectorAll("[data-color]").forEach((btn) => {
        btn.addEventListener("click", () => {
          color = Number(btn.dataset.color.replace("#", "0x"));
          if (vto) vto.setFrame({ style, color });
        });
      });
      document.querySelector("#start").addEventListener("click", async () => {
        msg.textContent = "Yüklənir…";
        try {
          vto = await EynekTryOn.create({ container: "#stage", style, color });
          await vto.start();
          msg.textContent = "Kamera açıqdır. Üzü kadra gətirin.";
        } catch (err) {
          msg.textContent = err.message || "Kamera açılmadı.";
        }
      });
    </script>
  </body>
</html>
