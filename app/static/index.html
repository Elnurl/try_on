<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tryon-wa — Həftə 1 demo</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Demo · brend saytı</p>
        <h1>Eynəyi üzdə yoxla</h1>
        <p class="lede">
          Müştəri şəkilini WhatsApp-a atmir — brendin öz səhifəsində yoxlayır.
          Qurulum: <a href="/for-brands">iframe kodu</a>.
        </p>
      </header>

      <section class="panel">
        <label class="upload">
          <input id="photo" type="file" accept="image/*" capture="user" />
          <span>Şəkil seç və ya çək</span>
        </label>
        <div id="frames" class="frames"></div>
        <p id="status" class="status" hidden></p>
      </section>

      <section class="preview">
        <figure>
          <figcaption>Orijinal</figcaption>
          <img id="source" alt="Yüklənmiş şəkil" hidden />
          <div id="source-empty" class="empty">Selfie burada görünəcək</div>
        </figure>
        <figure>
          <figcaption>Nəticə</figcaption>
          <img id="result" alt="Try-on nəticəsi" hidden />
          <div id="result-empty" class="empty">Overlay burada görünəcək</div>
        </figure>
      </section>
    </main>
    <script src="/static/widget.js"></script>
  </body>
</html>
