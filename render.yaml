# Render.com blueprint: Eynek VTO service + persistent disk for stores and product assets.
services:
  - type: web
    name: tryon-wa
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false # protects /admin and /v1/admin/*
      - key: VTO_SECRET
        sync: false # signs seller upload tokens; any long random string
      - key: PUBLIC_URL
        sync: false # e.g. https://tryon-wa.onrender.com (absolute asset URLs)
    disk:
      name: tryon-data
      mountPath: /srv/app/data
      sizeGB: 1
