# Render.com blueprint: web service + persistent disk for brand catalogs/uploads.
services:
  - type: web
    name: tryon-wa
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEEPAR_LICENSE_KEY
        sync: false # DeepAR web key for tryon-wa.onrender.com + localhost
      - key: FITTINGBOX_API_KEY
        sync: false # Public Fittingbox browser key for Glassify /shop
    disk:
      name: tryon-data
      mountPath: /srv/app/data
      sizeGB: 1
